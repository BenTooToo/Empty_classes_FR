<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion à l’administration du lycée n°6 de Zhetang</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="admin-kicker">ZT6 CLASS ARCHIVE</p>
        <h1>Interface d’administration</h1>
      </div>
      <span class="admin-state" id="adminState">Vérification du compte</span>
    </header>

    <main class="admin-main">
      <section class="admin-login-panel" id="loginPanel" aria-labelledby="loginTitle">
        <h2 id="loginTitle">Connexion administrateur</h2>
        <form class="admin-login-form" id="adminLoginForm" autocomplete="off">
          <label for="adminUsername">nom d'utilisateur</label>
          <input id="adminUsername" name="username" type="text" required data-history-key="admin-username">

          <label for="adminPassword">mot de passe</label>
          <input id="adminPassword" name="password" type="password" required aria-describedby="passwordHint" data-history-key="admin-password">
          <p class="admin-field-hint" id="passwordHint">Le mot de passe doit être saisi uniquement en lettres latines minuscules.</p>

          <button type="submit">Se connecter</button>
          <p class="admin-message" id="adminMessage" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-loading-panel" id="loadingPanel" hidden aria-live="polite">
        <h2>Accès à l’administration</h2>
        <div class="admin-loading-box">
          <p id="loadingLine">Vérification des autorisations du compte...</p>
          <div class="admin-loading-track">
            <span id="loadingBar"></span>
          </div>
        </div>
      </section>

    </main>

    <footer class="admin-footer">
      <a href="school.html">Retour à l’annuaire</a>
    </footer>
  </div>

  <script src="admin.js"></script>
  <script src="input-history.js"></script>
  <script src="pagination.js"></script>
</body>
</html>
