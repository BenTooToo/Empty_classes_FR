<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chiffreur de hachage</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="role-admin-page theme-dark theme-monitor hash-cracker-page">
  <div class="role-admin-shell hash-cracker-shell">
    <header class="role-admin-header role-detail-header">
      <a class="role-admin-back" href="admin-monitor-dashboard.html">Retour au tableau de bord</a>
      <div>
        <p class="role-admin-kicker">ADMIN PROGRAM / HASH</p>
        <h1>chiffreur de hachage</h1>
      </div>
    </header>

    <main class="hash-cracker-main">
      <section class="hash-unlock-panel" id="hashUnlockPanel" aria-labelledby="hashUnlockTitle">
        <h2 id="hashUnlockTitle">verrouillage du programme</h2>
        <form class="pin-form" id="pinForm" autocomplete="off">
          <div class="pin-boxes" aria-label="mot de passe à quatre chiffres">
            <input class="pin-box" id="pinDigit1" type="text" inputmode="numeric" maxlength="1" aria-label="1er mot de passe">
            <input class="pin-box" id="pinDigit2" type="text" inputmode="numeric" maxlength="1" aria-label="2ème mot de passe">
            <input class="pin-box" id="pinDigit3" type="text" inputmode="numeric" maxlength="1" aria-label="Mot de passe à 3ème chiffres">
            <input class="pin-box" id="pinDigit4" type="text" inputmode="numeric" maxlength="1" aria-label="Mot de passe à 4ème chiffres">
          </div>
          <button type="submit">Ouvrir</button>
          <p class="pin-error" id="pinError" role="status" aria-live="polite" hidden>Mauvais mot de passe</p>
        </form>
      </section>

      <section class="hash-loading-panel" id="hashLoadingPanel" hidden aria-live="polite">
        <div class="hash-loading-core"></div>
        <p>Chargement du noyau de chiffrement...</p>
      </section>

      <section class="hash-tool-panel" id="hashToolPanel" hidden aria-labelledby="hashToolTitle">
        <h2 id="hashToolTitle">Générateur de hachage</h2>
        <form class="hash-date-form" id="hashDateForm" autocomplete="off">
          <div class="hash-date-row">
            <input id="hashDateInput" name="hashDateInput" type="text" aria-label="Entrée du générateur" data-history-key="hash-date">
            <button type="submit">générer</button>
          </div>
        </form>
        <output class="hash-output" id="hashOutput" aria-live="polite"></output>
      </section>
    </main>
  </div>

  <script src="../admin-hash-cracker.js"></script>
  <script src="../input-history.js"></script>
  <script src="../pagination.js"></script>
</body>
</html>
